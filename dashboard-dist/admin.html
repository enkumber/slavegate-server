<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Network — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f23; color: #ccc; font-family: 'Courier New', monospace; padding: 20px; }
  h1 { color: #00ff41; margin-bottom: 10px; font-size: 1.4em; }
  .login-box, .dashboard { max-width: 900px; margin: 0 auto; }
  input, button { font-family: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid #333; background: #1a1a2e; color: #ccc; border-radius: 4px; }
  button { cursor: pointer; background: #16213e; border-color: #0f3460; }
  button:hover { background: #0f3460; }
  .btn-approve { background: #064e3b; border-color: #059669; color: #34d399; }
  .btn-approve:hover { background: #059669; color: #fff; }
  .btn-reject { background: #4a1420; border-color: #dc2626; color: #f87171; }
  .btn-reject:hover { background: #dc2626; color: #fff; }
  .btn-revoke { background: #4a3520; border-color: #d97706; color: #fbbf24; }
  .btn-revoke:hover { background: #d97706; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
  th { color: #00ff41; border-bottom: 2px solid #333; }
  .status-pending { color: #fbbf24; }
  .status-approved { color: #34d399; }
  .status-revoked { color: #f87171; }
  .status-blocked { color: #ef4444; }
  .refresh-btn { margin: 10px 0; }
  .actions { display: flex; gap: 5px; }
  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 999; display: none; }
  .toast-ok { background: #059669; }
  .toast-err { background: #dc2626; }
  #login-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta { color: #666; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>

<div class="login-box" id="login-section">
  <h1>🔐 Phone Network Admin</h1>
  <form id="login-form" onsubmit="doLogin(event)">
    <input id="user" placeholder="Username" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>
</div>

<div class="dashboard" id="dash" style="display:none">
  <h1>📱 Phone Network — Devices</h1>
  <button class="refresh-btn" onclick="loadDevices()">🔄 Refresh</button>
  <span id="count" class="meta"></span>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Pubkey</th>
        <th>Last Seen</th>
        <th>Battery</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="devices"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('pn_token') || '';
const API = window.location.origin + '/api';

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
  return r.json();
}

async function doLogin(e) {
  e.preventDefault();
  try {
    const res = await api('/auth/login', 'POST', {
      username: document.getElementById('user').value,
      password: document.getElementById('pass').value
    });
    if (res.ok) {
      TOKEN = res.data.accessToken;
      localStorage.setItem('pn_token', TOKEN);
      showDash();
    } else {
      toast(res.error || 'Login failed', false);
    }
  } catch (err) { toast(err.message, false); }
}

function logout() {
  TOKEN = '';
  localStorage.removeItem('pn_token');
  document.getElementById('login-section').style.display = '';
  document.getElementById('dash').style.display = 'none';
}

function showDash() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('dash').style.display = '';
  loadDevices();
}

function timeAgo(ts) {
  if (!ts) return '—';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

async function loadDevices() {
  try {
    const res = await api('/devices');
    const devices = res.ok ? (res.data || res.devices || []) : [];
    const tbody = document.getElementById('devices');
    document.getElementById('count').textContent = devices.length + ' device(s)';
    tbody.innerHTML = devices.map(d => {
      const h = d.health || {};
      const bat = h.batteryLevel != null ? h.batteryLevel + '%' + (h.isCharging ? ' ⚡' : '') : '—';
      const statusClass = 'status-' + (d.status || 'pending');
      const actions = [];
      if (d.status === 'pending') {
        actions.push(`<button class="btn-approve" onclick="approveDevice('${d.id}')">✅ Approve</button>`);
        actions.push(`<button class="btn-reject" onclick="rejectDevice('${d.id}')">❌ Reject</button>`);
      } else if (d.status === 'approved') {
        actions.push(`<button class="btn-revoke" onclick="revokeDevice('${d.id}')">🚫 Revoke</button>`);
      } else {
        actions.push(`<button class="btn-approve" onclick="approveDevice('${d.id}')">✅ Re-approve</button>`);
      }
      return `<tr>
        <td title="${d.id}">${(d.id||'').slice(0,8)}</td>
        <td>${d.friendly_name || d.friendlyName || '—'}</td>
        <td class="${statusClass}">${d.status || 'pending'}</td>
        <td title="${d.nostr_pubkey || ''}">${(d.nostr_pubkey||d.nostrPubkey||'—').slice(0,12)}…</td>
        <td>${timeAgo(d.last_seen_at || d.lastSeenAt)}</td>
        <td>${bat}</td>
        <td class="actions">${actions.join('')}</td>
      </tr>`;
    }).join('');
  } catch (err) { toast('Load failed: ' + err.message, false); }
}

async function approveDevice(id) {
  try {
    const res = await api('/devices/' + id + '/approve', 'POST', { friendlyName: '' });
    toast(res.ok ? 'Device approved ✅' : (res.error || 'Failed'), res.ok);
    loadDevices();
  } catch (err) { toast(err.message, false); }
}

async function rejectDevice(id) {
  try {
    const res = await api('/devices/' + id + '/block', 'POST');
    toast(res.ok ? 'Device rejected ❌' : (res.error || 'Failed'), res.ok);
    loadDevices();
  } catch (err) { toast(err.message, false); }
}

async function revokeDevice(id) {
  try {
    const res = await api('/devices/' + id + '/revoke', 'POST');
    toast(res.ok ? 'Device revoked 🚫' : (res.error || 'Failed'), res.ok);
    loadDevices();
  } catch (err) { toast(err.message, false); }
}

// Auto-refresh every 30s
setInterval(() => { if (TOKEN) loadDevices(); }, 30000);

// Check if already logged in
if (TOKEN) showDash();
</script>
</body>
</html>
