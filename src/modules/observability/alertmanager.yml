# Alertmanager Configuration — Phone Network Server
# Version: Phase 4 (B3)
#
# Env vars required (inject via Docker / systemd):
#   ALERTMANAGER_TELEGRAM_BOT_TOKEN  — Bot token for Dan's Telegram alerts
#   ALERTMANAGER_TELEGRAM_CHAT_ID    — Dan's chat/group ID (integer)
#
# Companion rules file: prometheus-rules.yml
# Webhook receiver: POST /api/alerts/webhook (handled by routes.ts)
#
# Critical alerts: device offline >5min, ban detected, VLM error rate >10%, job failure >20%

global:
  # How long to wait before declaring an alert resolved if it stops firing
  resolve_timeout: 5m

  # SMTP not used — Telegram is the sole notification channel
  # http_config and smtp_* intentionally omitted

# ─── Templates ─────────────────────────────────────────────────────────────────
# Custom message templates (optional — inline message defined in receiver below)
# templates:
#   - '/etc/alertmanager/templates/*.tmpl'

# ─── Routing tree ──────────────────────────────────────────────────────────────
route:
  # Catch-all: silence everything not matched by sub-routes
  receiver: 'null'

  # Group alerts by these labels — one notification per unique combination
  group_by: ['alertname', 'device_id', 'platform']

  # Wait up to 30s for more alerts before sending first notification (batching)
  group_wait: 30s

  # After first notification, wait before sending follow-up for same group
  group_interval: 5m

  # Default repeat interval for unresolved alerts
  repeat_interval: 4h

  routes:
    # ── Critical alerts → Telegram immediately, repeat every hour ─────────────
    - matchers:
        - severity = "critical"
      receiver: telegram-dan
      group_wait: 15s          # Faster first notification for critical
      group_interval: 2m
      repeat_interval: 1h
      continue: false          # Don't fall through to catch-all

    # ── Warning alerts → Telegram, repeat every 4h ────────────────────────────
    - matchers:
        - severity = "warning"
      receiver: telegram-dan
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: false

# ─── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  # Null receiver — swallows alerts that don't match any route
  - name: 'null'

  # Dan's Telegram notifications
  - name: 'telegram-dan'
    telegram_configs:
      - bot_token: '${ALERTMANAGER_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERTMANAGER_TELEGRAM_CHAT_ID}
        parse_mode: 'MarkdownV2'
        # send_resolved: true sends a green notification when alert clears
        send_resolved: true
        message: |
          {{ range .Alerts }}
          {{ if eq .Status "firing" }}
          {{- if eq .Labels.severity "critical" }}🔴{{ else }}⚠️{{ end }} *{{ .Labels.alertname | reReplaceAll `[_\-\.]` `\\$0` }}* \[{{ .Labels.severity | upper }}\]
          {{ else }}
          ✅ *RESOLVED: {{ .Labels.alertname | reReplaceAll `[_\-\.]` `\\$0` }}*
          {{ end }}
          {{- if .Annotations.summary }}{{ .Annotations.summary | reReplaceAll `[_\-\.\(\)\[\]\{\}]` `\\$0` }}{{ end }}
          {{- if .Annotations.description }}
          {{ .Annotations.description | reReplaceAll `[_\-\.\(\)\[\]\{\}]` `\\$0` }}{{ end }}
          {{- if .Labels.device_id }}\nDevice: `{{ .Labels.device_id }}`{{ end }}
          {{- if .Labels.platform }}\nPlatform: {{ .Labels.platform }}{{ end }}
          {{ end }}

    # Fallback: also POST to server webhook (server forwards to Telegram with richer context)
    # Useful if bot_token env var not available in Alertmanager container
    webhook_configs:
      - url: 'http://phone-network-server:3000/api/alerts/webhook'
        send_resolved: true
        max_alerts: 20
        http_config:
          # Internal network only — no auth needed
          # Set METRICS_AUTH_TOKEN on the route if exposed externally
          follow_redirects: false

# ─── Inhibit rules ─────────────────────────────────────────────────────────────
inhibit_rules:
  # When kill switch is active, suppress all warning-level alerts
  # (fleet is already in emergency mode — no need for noise)
  - source_matchers:
      - alertname = "KillSwitchActivated"
    target_matchers:
      - severity = "warning"
    equal: []   # applies globally, not scoped to same label values

  # Suppress device-level alerts when fleet-wide kill switch fires
  - source_matchers:
      - alertname = "KillSwitchActivated"
    target_matchers:
      - alertname = "DeviceOffline"
    equal: []

  # Suppress individual ban alerts if VLM error rate is spiking
  # (mass detection event — single signal covers it)
  - source_matchers:
      - alertname = "VLMHighErrorRate"
      - severity = "critical"
    target_matchers:
      - alertname = "AccountBanDetected"
    equal: ['platform']
