# Prometheus Alerting Rules — Phone Network Server
# Version: Phase 4 (B3 companion)
#
# Load in prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/phone-network.yml
#
# All alerts route through alertmanager.yml receivers.
# Critical alerts: device offline >5min, ban detected, VLM error >10%, job failure >20%
#
# Metric prefix: phone_network_*  (see observability/metrics.ts)

groups:
  # ─── Device Health ──────────────────────────────────────────────────────────
  - name: phone-network.devices
    interval: 60s  # Evaluate every 60s (tighter than default 1m for offline detection)
    rules:
      # Device offline for more than 5 minutes.
      # Requires phone_network_device_last_seen_seconds gauge (set in recordDeviceHealth()).
      - alert: DeviceOffline
        expr: |
          (time() - phone_network_device_last_seen_seconds{job="phone-network"}) > 300
        for: 0m  # Fire immediately — gauge already represents elapsed time
        labels:
          severity: critical
        annotations:
          summary: "Device {{ $labels.device_id }} offline for {{ $value | humanizeDuration }}"
          description: >
            Device {{ $labels.device_id }} has not sent a heartbeat for
            {{ $value | humanizeDuration }}. Check device connectivity and agent process.

      # Device battery critical (< 10%, not charging) — warning only
      - alert: DeviceBatteryCritical
        expr: |
          phone_network_device_battery_percent{job="phone-network"} < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device_id }} battery critical ({{ $value }}%)"
          description: "Battery below 10%. Device may disconnect soon."

  # ─── Account Health ─────────────────────────────────────────────────────────
  - name: phone-network.accounts
    rules:
      # Any account ban detected in the last 5 minutes
      - alert: AccountBanDetected
        expr: |
          increase(phone_network_account_banned_total{job="phone-network"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Account banned on {{ $labels.platform }}"
          description: >
            {{ $value | printf "%.0f" }} account(s) banned on {{ $labels.platform }}
            in the last 5 minutes. Check ban-detector logs and account status.

      # Multiple challenges in short window — possible coordinated detection
      - alert: AccountChallengeSurge
        expr: |
          increase(phone_network_account_challenged_total{job="phone-network"}[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Challenge surge on {{ $labels.platform }}: {{ $value | printf \"%.0f\" }} in 15min"
          description: >
            Unusual number of CAPTCHA/verification challenges detected.
            May indicate fingerprint leak or behavioral pattern detection.

  # ─── VLM / Vision ───────────────────────────────────────────────────────────
  - name: phone-network.vlm
    rules:
      # VLM error rate exceeds 10% over 10-minute window
      - alert: VLMHighErrorRate
        expr: |
          (
            rate(phone_network_vlm_errors_total{job="phone-network"}[10m])
            /
            rate(phone_network_vlm_requests_total{job="phone-network"}[10m])
          ) > 0.10
        for: 5m  # Must persist for 5min before firing (avoid transient spikes)
        labels:
          severity: critical
        annotations:
          summary: "VLM error rate {{ $value | humanizePercentage }} on {{ $labels.provider }}"
          description: >
            VLM provider {{ $labels.provider }} error rate exceeded 10% threshold for 5 minutes.
            Workflows may be degraded. Check API key, quota, and provider status.

      # VLM latency spike — p95 > 15s
      - alert: VLMHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(phone_network_vlm_latency_seconds_bucket{job="phone-network"}[10m])
          ) > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VLM p95 latency {{ $value | humanizeDuration }} on {{ $labels.provider }}"
          description: "VLM API calls are slow. Workflows queued behind VLM calls may timeout."

  # ─── Job Dispatch ────────────────────────────────────────────────────────────
  - name: phone-network.jobs
    rules:
      # Job failure rate exceeds 20% over 10-minute window
      - alert: HighJobFailureRate
        expr: |
          (
            rate(phone_network_job_failed_total{job="phone-network"}[10m])
            /
            rate(phone_network_job_dispatched_total{job="phone-network"}[10m])
          ) > 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Job failure rate {{ $value | humanizePercentage }} on action {{ $labels.action }}"
          description: >
            Job failure rate exceeded 20% threshold for 5 minutes (action: {{ $labels.action }}).
            Check device connectivity, ADB errors, and dispatcher logs.

      # No jobs dispatched in last 30 min during expected active hours — possible deadlock
      - alert: JobDispatchStalled
        expr: |
          rate(phone_network_job_dispatched_total{job="phone-network"}[30m]) == 0
          and on() hour() >= 8 and on() hour() <= 22
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No jobs dispatched in 30 minutes (business hours)"
          description: "Dispatcher may be stalled. Check dispatcher.service.ts logs and Redis queue."

  # ─── Anti-Detection ──────────────────────────────────────────────────────────
  - name: phone-network.anti-detection
    rules:
      # Fingerprint leak detected
      - alert: FingerprintLeakDetected
        expr: |
          increase(phone_network_detection_events_total{
            job="phone-network",
            event_type="fingerprint_leak"
          }[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Fingerprint leak detected on device {{ $labels.device_id }}"
          description: >
            Device {{ $labels.device_id }} fingerprint leaked. Rotation required immediately.
            Check fingerprint-config.ts and anti-detection module logs.

      # Kill switch activated (metric set to 1 in routes.ts)
      - alert: KillSwitchActivated
        expr: phone_network_kill_switch_active{job="phone-network"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "🛑 Kill switch ACTIVATED — all workflows suspended"
          description: >
            Kill switch is active. All running and queued workflows have been cancelled.
            Deactivate via POST /api/kill-switch { activate: false } when safe to resume.

  # ─── Parser Quality ──────────────────────────────────────────────────────────
  - name: phone-network.parser
    rules:
      # Parser confidence avg drops below 65% for a platform
      - alert: ParserConfidenceDegraded
        expr: |
          phone_network_parser_confidence_avg{job="phone-network"} < 0.65
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Parser confidence degraded on {{ $labels.platform }}: {{ $value | humanizePercentage }}"
          description: >
            Parser average confidence below 65% for 15 minutes on {{ $labels.platform }}.
            UI layout may have changed. Check parser version compatibility and update selectors.
